name: Task checks
on:
  push:
    branches: [checks-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check behavior
        run: |
          node .checks/run_checks.cjs .checks/cases.json .checks/results.json
          node .checks/run_checks.cjs .checks/captured-cases.json .checks/captured-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checks
          path: |
            .checks/results.json
            .checks/captured-results.json
          retention-days: 7
